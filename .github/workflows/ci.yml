name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No secrets are configured anywhere in this workflow, and that is the point: the platform's
      # Mock chat provider, Mock embedder and dev-auth are what let a bare clone build and test.
      # A CI job here that needs an API key is a defect in the change, not in the workflow.
      - name: Restore
        run: dotnet restore Hireworthy.slnx

      - name: Build
        run: dotnet build Hireworthy.slnx --no-restore --configuration Release

      # The module guard needs no Docker: manifest integrity, tool/permission parity, and the
      # per-entity tenant query filters whose absence is a silent cross-tenant leak.
      - name: Test — module guard
        run: dotnet test tests/Hireworthy.Hiring.Tests --no-build --configuration Release

      # The branded shell (ADR-0011). @plenipo/ui is on PUBLIC npm — no .npmrc, no token — so this
      # step is what proves the keyless claim on a clean runner rather than on one developer's
      # machine. `tsc -b` runs inside `build`, so a type error in a tab fails here.
      - name: Install — frontend
        run: pnpm install --frozen-lockfile
        working-directory: frontend/hireworthy-ui

      - name: Build — frontend
        run: pnpm run build
        working-directory: frontend/hireworthy-ui

      # Boots the real host against a real Postgres. Docker is available on ubuntu-latest.
      - name: Test — integration
        run: dotnet test tests/Hireworthy.IntegrationTests --no-build --configuration Release
