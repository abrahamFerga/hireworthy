# This is a single package, not a monorepo. The file exists anyway because pnpm creates it
# unprompted to ask which dependencies may run install scripts -- and once it exists, pnpm
# refuses to install unless `packages` is declared. Both keys are set here so the file is
# valid rather than a half-answered prompt.
packages:
  - .

# An allowlist of exactly one package, not a blanket "run every postinstall". esbuild ships
# prebuilt per-platform binaries and its install script links the right one for the machine;
# vite cannot bundle without it. Everything else stays blocked, which is the point -- an
# install script is arbitrary code execution at dependency-install time.
allowBuilds:
  esbuild: true

# The minimum-release-age policy exists to keep a freshly-published, possibly compromised version of
# a third-party package out of an unattended install. The platform we are BUILT ON is not a
# third party: its release is the thing this repo is deliberately adopting, pinned to the same
# version string as the .NET packages in Directory.Build.props. Written by `pnpm install` on the
# alpha.29 bump; each entry is exact, so a later version is still gated.
minimumReleaseAgeExclude:
  - '@plenipo/client@0.1.0-alpha.29'
  - '@plenipo/ui@0.1.0-alpha.29'
